# Recommended ~/.tmux.conf for the machine your sessions run on. vmux runs
# tmux there, not on your laptop, so this file belongs there:
#
#   scp tmux.conf YOUR-HOST:~/.tmux.conf

set -g  focus-events on         # Claude Code asks for this
set -g  history-limit 100000    # keep a long job's output in scrollback
set -sg escape-time 10          # don't make Esc lag inside Claude's TUI
